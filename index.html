
<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">

<title>وثيقة دخول و خروج العمال</title><link rel="icon" href="logo.png"><link rel="apple-touch-icon" href="logo.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="دخول و خروج"><meta name="theme-color" content="#0b6e4f">
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b2430;--ac:#0b6e4f;--bd:#cfd6dd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171c;--card:#1c242c;--tx:#e8edf2;--ac:#3fb98a;--bd:#38444f}}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;min-height:100%}
.box{max-width:420px;margin:8vh auto;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:22px;text-align:center}
h1{font-size:20px;margin:0 0 14px}
input,select,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px;max-width:100%;box-sizing:border-box}
button{background:var(--ac);color:#fff;border:0;cursor:pointer;padding:10px 16px}
button.alt{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.pin{letter-spacing:10px;text-align:center;font-size:22px;width:100%;margin:8px 0}
.msg{color:#c0392b;min-height:20px;font-size:14px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
#app{padding:10px;max-width:900px;margin:auto}
.top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:8px}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px;background:var(--card)}
th,td{border:1px solid var(--bd);padding:4px;text-align:center}
th{background:var(--ac);color:#fff;font-size:13px}
td input,td select{width:100%;border:0;padding:6px 2px;background:transparent}
.sig{display:flex;justify-content:space-around;margin:26px 0;gap:10px}
.sig div{border-top:1px solid var(--tx);padding-top:6px;width:42%;text-align:center}
.bar{display:flex;gap:8px;margin:8px 0}
.hd{display:flex;justify-content:space-between;align-items:flex-start;direction:ltr;gap:10px;margin-bottom:8px}
.lg{text-align:center;font-size:11px;line-height:1.4;max-width:230px}.lg img{width:110px;height:auto;display:block;margin:0 auto 2px}
.dt{font-size:14px;white-space:nowrap;flex-wrap:nowrap;display:flex;gap:5px;align-items:center;justify-content:center}.dt input{width:105px;flex:none;text-align:center}
.dtw{text-align:center;width:max-content;max-width:100%}.dtw .svc{max-width:210px;margin:6px auto 0}.rt{display:flex;align-items:center;gap:12px}.svc{font-weight:bold;font-size:13px;text-align:center;max-width:150px}
.ttl{border:2px solid var(--tx);padding:8px 18px;margin:10px auto;width:max-content;max-width:90%;text-align:center;font-weight:bold;font-size:18px}
textarea{width:100%;min-height:80px;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;box-sizing:border-box;padding:8px}
@media print{.noprint{display:none!important}body{background:#fff;color:#000}th{background:#ddd;color:#000}}
</style></head><body>
<div id="v"></div>
<script>
var T={ar:{reg:"التسجيل",pinNew:"أنشئ رقمك السري (6 أعداد)",pinConf:"أعد إدخال الرقم السري",pinIn:"أدخل الرقم السري",ok:"اعتماد",enter:"دخول",bad:"الرقم السري غير صحيح",six:"يجب إدخال 6 أعداد",diff:"الرقمان غير متطابقين",lang:"اختر اللغة",title:"وثيقة دخول و خروج العمال",date:"التاريخ",grp:"الفوج",g1:"الفوج A",g2:"الفوج B",g3:"الفوج C",g4:"الفوج D",g5:"الفوج E",n:"القيد",name:"اسم و لقب العامل",tin:"ساعة الدخول",tout:"ساعة الخروج",hrs:"ساعات العمل",why:"سبب الخروج",none:"—",nodoc:"بدون وثيقة",boss:"مطرود من طرف المسؤول",nurse:"مطرود من طرف الممرض",adm:"عمل بالإدارة",sg:"إمضاء رئيس الفوج",ss:"إمضاء رئيس المصلحة",db:"قاعدة البيانات",loc:"بئر العاتر في",svc:"مصلحة الوقاية و الأمن الصناعي",imp:"استيراد",pst:"انسخ من Excel عمودي القيد و الاسم و الصقهما هنا",sheet:"الجدول",add:"إضافة",del:"حذف",pr:"طباعة",out:"خروج",clr:"مسح الجدول",nm:"الاسم و اللقب"},
fr:{reg:"Inscription",pinNew:"Créez votre code secret (6 chiffres)",pinConf:"Confirmez le code secret",pinIn:"Entrez le code secret",ok:"Valider",enter:"Entrer",bad:"Code incorrect",six:"6 chiffres requis",diff:"Les codes diffèrent",lang:"Choisissez la langue",title:"Registre d'entrée et de sortie des ouvriers",date:"Date",grp:"Équipe",g1:"Équipe A",g2:"Équipe B",g3:"Équipe C",g4:"Équipe D",g5:"Équipe E",n:"N°",name:"Nom et prénom",tin:"Heure d'entrée",tout:"Heure de sortie",hrs:"Heures travaillées",why:"Motif de sortie",none:"—",nodoc:"Sans document",boss:"Renvoyé par le responsable",nurse:"Renvoyé par l'infirmier",adm:"Travail à l'administration",sg:"Signature du chef d'équipe",ss:"Signature du chef de service",db:"Base de données",loc:"Bir El Ater, le",svc:"Service Prévention et Sécurité Industrielle",imp:"Importer",pst:"Copiez depuis Excel les colonnes N° et Nom, puis collez ici",sheet:"Tableau",add:"Ajouter",del:"Suppr.",pr:"Imprimer",out:"Quitter",clr:"Vider le tableau",nm:"Nom et prénom"}};
var LOGO="societe-des-mines-de-phosphate-SK02DkvyLH.webp";document.querySelectorAll('link[rel$="icon"]').forEach(function(l){l.href=LOGO});
function bl(){return'<div class="lg" style="margin:0 auto 12px;direction:ltr"><img src="'+LOGO+'" alt=""><div>Société des Mines de Phosphates<br>SOMIPHOS Spa. Filiale du Groupe SONAREM<br>Complexe Minier de Djebel Onk</div><div class="svc" style="margin:6px auto 0;max-width:none;direction:'+(L=='fr'?'ltr':'rtl')+'">'+t('svc')+'</div></div>'+(cur?'<div style="font-weight:bold;margin-bottom:10px">'+gn()+'</div>':'')}
var S={pin:null,lang:null,db:[],rows:[],date:"",grp:"1"},tab="sheet",L="ar",tmp=null;
var G={},cur=null;
function gn(){return t("g"+cur)}
function ld(){try{var s=JSON.parse(localStorage.getItem("reg2")||"null");if(s)G=s;else{var o=JSON.parse(localStorage.getItem("reg1")||"null");if(o&&o.pin)G[1]=o}}catch(e){}}
function pick(g){cur=g;if(!G[g])G[g]={pin:null,lang:null,db:[],rows:[],date:""};S=G[g];tmp=null;tab="sheet";R()}
function sv(){try{localStorage.setItem("reg2",JSON.stringify(G))}catch(e){}}
function t(k){return T[L][k]}
function h(x){return String(x==null?"":x).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function mk(){var r=[];for(var i=0;i<20;i++)r.push({n:"",tin:"",tout:"",why:""});return r}
function dir(){document.documentElement.lang=L;document.documentElement.dir=L=="ar"?"rtl":"ltr"}
function R(){var v=document.getElementById("v");L=cur?(S.lang||"ar"):"ar";dir();
 if(!cur){v.innerHTML='<div class="box">'+bl()+'<h1>اختر الفوج / Choisissez l\'équipe</h1><div class="row" style="flex-direction:column">'+[1,2,3,4,5].map(function(g){return'<button onclick="pick('+g+')">'+T.ar["g"+g]+' / '+T.fr["g"+g]+'</button>'}).join("")+'</div></div>';return}
 if(!S.pin){v.innerHTML='<div class="box">'+bl()+'<h1>'+t("reg")+'</h1><p>'+t("pinNew")+'</p><input id="p1" class="pin" type="password" inputmode="numeric" maxlength="6"><p>'+t("pinConf")+'</p><input id="p2" class="pin" type="password" inputmode="numeric" maxlength="6"><div class="msg" id="m"></div><button onclick="reg()">'+t("ok")+'</button></div>';return}
 if(!tmp){v.innerHTML='<div class="box">'+bl()+'<h1>'+t("title")+'</h1><p>'+t("pinIn")+'</p><input id="p1" class="pin" type="password" inputmode="numeric" maxlength="6"><div class="msg" id="m"></div><button onclick="lg()">'+t("enter")+'</button></div>';return}
 if(!S.lang){v.innerHTML='<div class="box">'+bl()+'<h1>'+T.ar.lang+' / '+T.fr.lang+'</h1><div class="row"><button onclick="sl(\'ar\')">العربية</button><button onclick="sl(\'fr\')">Français</button></div></div>';return}
 var h1='<div id="app"><div class="top noprint"><div class="bar"><button class="'+(tab=="sheet"?"":"alt")+'" onclick="tab=\'sheet\';R()">'+t("sheet")+'</button><button class="'+(tab=="db"?"":"alt")+'" onclick="tab=\'db\';R()">'+t("db")+'</button></div><div class="bar"><button class="alt" onclick="sl(L==\'ar\'?\'fr\':\'ar\')">'+(L=="ar"?"Français":"العربية")+'</button><button class="alt" onclick="window.print()">'+t("pr")+'</button><button class="alt" onclick="cur=null;tmp=null;R()">'+t("out")+'</button></div></div>';
 v.innerHTML=h1+(tab=="sheet"?sheet():dbp())+'</div>';calcAll()}
function reg(){var a=p1.value,b=p2.value,m=document.getElementById("m");if(!/^\d{6}$/.test(a)){m.textContent=t("six");return}if(a!=b){m.textContent=t("diff");return}S.pin=a;tmp=1;sv();R()}
function lg(){if(p1.value===S.pin){tmp=1;R()}else document.getElementById("m").textContent=t("bad")}
function sl(l){S.lang=l;sv();R()}
function sheet(){var H=["5:00","6:00","7:00","13:00","21:00"],W=["C18","C91","nodoc","boss","nurse","adm"];if(!S.rows.length)S.rows=mk();
 var o='<div class="hd"><div class="dtw"><label class="dt" style="direction:'+(L=="ar"?"rtl":"ltr")+'"><span>'+t("loc")+'</span><span>:</span><input inputmode="numeric" maxlength="10" placeholder="JJ/MM/AAAA" value="'+h(S.date)+'" oninput="fd(this)"></label><div class="svc" style="direction:'+(L=="ar"?"rtl":"ltr")+'">'+t("svc")+'</div></div><div class="rt"><div class="lg"><img src="'+LOGO+'" alt=""><div>Société des Mines de Phosphates<br>SOMIPHOS Spa. Filiale du Groupe SONAREM<br>Complexe Minier de Djebel Onk</div></div></div></div><div class="ttl">'+t("title")+'</div><div class="row"><b>'+gn()+'</b></div><div class="wrap"><table><tr><th style="width:8%">'+t("n")+'</th><th>'+t("name")+'</th><th style="width:14%">'+t("tin")+'</th><th style="width:14%">'+t("tout")+'</th><th style="width:11%">'+t("hrs")+'</th><th style="width:20%">'+t("why")+'</th></tr>';
 S.rows.forEach(function(r,i){o+='<tr><td><input inputmode="numeric" value="'+h(r.n)+'" oninput="ed('+i+',\'n\',this.value)"></td><td id="nm'+i+'">'+h(nameOf(r.n))+'</td><td><select onchange="ed('+i+',\'tin\',this.value)"><option value=""></option>'+H.map(function(x){return'<option'+(r.tin==x?" selected":"")+'>'+x+'</option>'}).join("")+'</select></td><td><input inputmode="numeric" maxlength="5" placeholder="00:00" value="'+h(r.tout)+'" oninput="ft(this,'+i+')"></td><td id="h'+i+'"></td><td><select onchange="ed('+i+',\'why\',this.value)"><option value="">'+t("none")+'</option>'+W.map(function(x){return'<option value="'+x+'"'+(r.why==x?" selected":"")+'>'+(t(x)||x)+'</option>'}).join("")+'</select></td></tr>'});
 return o+'</table></div><div class="sig"><div>'+t("sg")+'</div><div>'+t("ss")+'</div></div><div class="noprint row"><button class="alt" onclick="if(confirm(\''+t("clr")+'?\')){S.rows=mk();sv();R()}">'+t("clr")+'</button></div>'}
function nameOf(n){var f=S.db.filter(function(d){return String(d.n)==String(n)&&n!==""})[0];return f?f.name:""}
function ed(i,k,v){S.rows[i][k]=v;sv();if(k=="n")document.getElementById("nm"+i).textContent=nameOf(v);calc(i)}
function calc(i){var r=S.rows[i],e=document.getElementById("h"+i);if(!e)return;if(!r.tin||!/^([01]?\d|2[0-3]):[0-5]\d$/.test(r.tout)){e.textContent="";return}
 var a=r.tin.split(":"),b=r.tout.split(":"),x=a[0]*60+ +a[1],y=b[0]*60+ +b[1];if(y<x)y+=1440;var d=y-x;e.textContent=Math.floor(d/60)+":"+("0"+d%60).slice(-2)}
function calcAll(){if(tab=="sheet")S.rows.forEach(function(_,i){calc(i)})}
function dbp(){var o='<div class="ttl">'+t("db")+'</div><div class="noprint"><textarea id="px" placeholder="'+t("pst")+'"></textarea><div class="row"><button onclick="im()">'+t("imp")+'</button></div></div><div class="row noprint"><input id="dn" inputmode="numeric" placeholder="'+t("n")+'" style="width:90px"><input id="dm" placeholder="'+t("nm")+'" style="flex:1;min-width:150px"><button onclick="ad()">'+t("add")+'</button></div><div class="wrap"><table><tr><th style="width:15%">'+t("n")+'</th><th>'+t("nm")+'</th><th class="noprint" style="width:15%"></th></tr>';
 S.db.forEach(function(d,i){o+='<tr><td>'+h(d.n)+'</td><td>'+h(d.name)+'</td><td class="noprint"><button class="alt" onclick="S.db.splice('+i+',1);sv();R()">'+t("del")+'</button></td></tr>'});return o+'</table></div>'}
function ad(){var n=dn.value.trim(),m=dm.value.trim();if(!n||!m)return;S.db=S.db.filter(function(d){return String(d.n)!=n});S.db.push({n:n,name:m});S.db.sort(function(a,b){return a.n-b.n});sv();R()}
function fd(el){var d=el.value.replace(/\D/g,"").slice(0,8),o=d;if(d.length>4)o=d.slice(0,2)+"/"+d.slice(2,4)+"/"+d.slice(4);else if(d.length>2)o=d.slice(0,2)+"/"+d.slice(2);el.value=o;S.date=o;sv()}
function ft(el,i){var d=el.value.replace(/\D/g,"").slice(0,4),o=d.length>2?d.slice(0,d.length-2)+":"+d.slice(-2):d;el.value=o;ed(i,"tout",o)}
function im(){px.value.split(/\r?\n/).forEach(function(l){l=l.trim();if(!l)return;var m=l.split("\t");var n,nm;if(m.length>1){n=m[0].trim();nm=m.slice(1).join(" ").trim()}else{var q=l.match(/^(\d+)[\s;,]+(.+)$/);if(!q)return;n=q[1];nm=q[2]}if(!/^\d+$/.test(n)||!nm)return;S.db=S.db.filter(function(d){return String(d.n)!=n});S.db.push({n:n,name:nm})});S.db.sort(function(a,b){return a.n-b.n});sv();R()}
ld();R();
</script></body></html>
